# Bluetooth: observer (scan) + broadcaster (advertise), no connections needed
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="iot-node"

# GPIO for button (SW0) and LED (led0)
CONFIG_GPIO=y

# Hardware RNG via nRF52840 entropy driver – required for sys_rand32_get()
CONFIG_ENTROPY_GENERATOR=y

# UART console for printk output (read via Renode TCP terminals)
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
